name: 구현·조사 작업
description: 로드맵 항목을 실행 가능한 작업으로 만듭니다.
title: "[task] "
body:
  - type: input
    id: roadmap
    attributes:
      label: 로드맵 ID와 의존 작업
      placeholder: KEC-012, depends on KEC-007
  - type: textarea
    id: problem
    attributes:
      label: 문제와 기대 동작
      description: 구체적인 사용자 흐름과 현재 상태를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 작업 범위와 산출물
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준과 검증 방법
      description: 테스트, 재현 명령, 문서 또는 실제 조사 근거를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: 제한·미확인 사항
      description: 네트워크, 자격증명, VM 자원, 라이선스, 접근성 등 실제 확인이 필요한 조건을 적어주세요.
