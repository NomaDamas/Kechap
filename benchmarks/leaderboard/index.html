<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kechap 근거 보드</title>
<style>body{font:17px/1.6 system-ui;max-width:1100px;margin:30px auto;padding:20px;background:#f7f7f2;color:#203329}section{background:white;padding:24px;border:1px solid #bbc9bc;margin:20px 0}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #ddd;padding:8px}button,select{font:inherit;padding:8px}meter{width:140px}small{display:block}a{color:#215d47}</style>
<h1>Kechap 근거 보드</h1><p>인간 UX·자동화 성공·운영 비용은 별도 지표입니다. 종합 “사람 점수”나 자동 보안 인증을 발급하지 않습니다.</p>
<label>결과 상태 <select id="filter"><option value="all">전체</option><option value="current">현재 비교 가능</option><option value="inactive">오래됨 / 철회 / 대체됨</option></select></label>
<p id="summary" role="status"></p><main id="cards"></main>
<script type="module">
const report=await(await fetch('./board.json',{cache:'no-store'})).json();
const node=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;};
function render(){const main=document.querySelector('#cards');main.replaceChildren();let count=0;for(const row of report.rows){const selected=document.querySelector('#filter').value;if(selected==='current'&&!row.eligibleForComparison||selected==='inactive'&&row.eligibleForComparison)continue;count++;const section=node('section');section.append(node('h2',row.id),node('p',`${row.category} · ${row.benchmarkRevision} · ${row.state}${row.stale?' · stale':''}`),node('p',`독립 재현: ${row.reproductionStatus}; 검증 배지: ${row.verified?'있음':'없음'}`));const table=node('table');const head=node('tr');for(const label of ['과제','방식','성공 / 분모','관찰 성공률'])head.append(node('th',label));table.append(head);for(const metric of row.metrics){const tr=node('tr');for(const value of [metric.surface,metric.baseline??'human-UX',`${metric.successes??metric.completed}/${metric.samples??metric.participants}`])tr.append(node('td',value));const cell=node('td'),value=(metric.successes??metric.completed)/(metric.samples??metric.participants),meter=node('meter');meter.min=0;meter.max=1;meter.value=value;meter.setAttribute('aria-label','해당 표본의 관찰 성공률');cell.append(meter,node('span',` ${(100*value).toFixed(1)}%`));tr.append(cell);table.append(tr);}section.append(table);for(const limitation of row.limitations)section.append(node('small',limitation));main.append(section);}document.querySelector('#summary').textContent=`${count}개 결과 카드. 현재 실제 인간 실험 데이터와 독립 검증 결과는 없습니다.`;}
document.querySelector('#filter').onchange=render;render();
</script></html>
